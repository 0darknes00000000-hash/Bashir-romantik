<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твое Имя — Финальная Версия</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Neucha&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #010108;
            font-family: 'Neucha', cursive;
        }

        #stage {
            width: 100%; height: 100%;
            transition: transform 7s cubic-bezier(0.1, 0.5, 0.2, 1);
            position: relative;
        }

        /* Небо как на фото */
        .sky-bg {
            position: absolute; top: -100%; left: 0; width: 100%; height: 250%;
            background: linear-gradient(to bottom, 
                #010105 0%, 
                #05051a 15%, 
                #0c0c2e 35%, 
                #23123a 55%, 
                #3a1a5a 75%, 
                #1a1a3a 100%);
            z-index: 1;
        }

        .moon {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            width: 120px; height: 120px;
            background: radial-gradient(circle, #fff 20%, #e0e0ff 80%);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(255, 255, 255, 0.25);
            z-index: 2;
        }

        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--d) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }

        /* КОМЕТА - МАКСИМАЛЬНАЯ ДЕТАЛИЗАЦИЯ */
        #cometCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; pointer-events: none; opacity: 0; transition: opacity 1.5s;
            filter: blur(0.5px) contrast(1.1);
        }

        /* Холм в стиле аниме */
        .hill {
            position: absolute; bottom: -5%; left: -10%; width: 120%; height: 42%;
            background: radial-gradient(ellipse at 50% 0%, #03030c 0%, #010103 100%);
            border-top-left-radius: 55% 100%; border-top-right-radius: 55% 100%;
            z-index: 3;
        }

        #grass {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 42%;
            z-index: 4; pointer-events: none;
        }

        /* Персонаж на вершине */
        .ghost-container {
            position: absolute; bottom: 26%; left: 50%; transform: translateX(-50%);
            z-index: 10; cursor: pointer; transition: 2.5s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .ghost {
            width: 32px; height: 42px; background: rgba(255, 255, 255, 0.92);
            border-radius: 18px 18px 4px 4px; box-shadow: 0 0 35px #fff;
            position: relative; animation: float 4.5s infinite ease-in-out;
        }
        .ghost::after, .ghost::before {
            content: ''; position: absolute; top: 14px; width: 4px; height: 5px; background: #222; border-radius: 50%;
        }
        .ghost::before { left: 8px; } .ghost::after { right: 8px; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Оверлей сообщения */
        #ov {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; transition: 0.8s;
        }
        #p {
            width: 88%; max-width: 400px; background: #fffdf7; padding: 40px;
            border-radius: 3px; transform: translateY(20px); transition: 0.6s;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .txt { font-family: 'Caveat', cursive; font-size: 24px; color: #1a1a1a; line-height: 1.5; }
        .btn {
            display: block; margin: 30px auto 0; padding: 12px 30px;
            background: #0c0c2e; color: #fff; border: none; border-radius: 25px;
            cursor: pointer; opacity: 0; transition: 0.6s; font-family: 'Neucha'; font-size: 18px;
        }

        #hint { position: fixed; bottom: 40px; width: 100%; text-align: center; color: #fff; opacity: 0.4; z-index: 20; letter-spacing: 1px; }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div id="stage">
    <div class="sky-bg"></div>
    <div class="moon"></div>
    <canvas id="cometCanvas"></canvas>
    <div class="hill"></div>
    <canvas id="grass"></canvas>
    <div class="ghost-container" id="gBox" onclick="openLetter()">
        <div class="ghost"></div>
    </div>
</div>

<div id="flash"></div>
<div id="hint">Коснись маленького призрака на холме...</div>

<div id="ov">
    <div id="p">
        <div class="txt" id="t"></div>
        <button class="btn" id="b" onclick="witnessMagic()">посмотреть в небо</button>
    </div>
</div>

<script>
    // 1. Звезды и трава
    const sky = document.querySelector('.sky-bg');
    for(let i=0; i<350; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        let size = Math.random() * 2.2 + 0.8;
        s.style.width = s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--d', (Math.random() * 4 + 2) + 's');
        sky.appendChild(s);
    }

    const gCanvas = document.getElementById('grass');
    const gctx = gCanvas.getContext('2d');
    let gw, gh, blades = [];

    function initG() {
        gw = gCanvas.width = window.innerWidth; gh = gCanvas.height = window.innerHeight * 0.42;
        blades = [];
        for(let i=0; i<500; i++) {
            blades.push({
                x: Math.random() * gw, 
                h: 25 + Math.random() * 45, 
                off: Math.random() * Math.PI, 
                s: 0.015 + Math.random() * 0.02
            });
        }
    }

    function drawG() {
        gctx.clearRect(0,0,gw,gh);
        gctx.strokeStyle = '#050815'; gctx.lineWidth = 1.3;
        blades.forEach(b => {
            let tilt = Math.sin(Date.now() * b.s + b.off) * 6;
            gctx.beginPath(); gctx.moveTo(b.x, gh);
            gctx.quadraticCurveTo(b.x + tilt, gh - b.h/2, b.x + tilt * 1.4, gh - b.h);
            gctx.stroke();
        });
        requestAnimationFrame(drawG);
    }
    window.addEventListener('resize', () => { initG(); initC(); });
    initG(); drawG();

    // 2. ПРОДВИНУТАЯ КОМЕТА (ЯДРО И ГАЗОВЫЙ ХВОСТ)
    const cCanvas = document.getElementById('cometCanvas');
    const cctx = cCanvas.getContext('2d');
    let cw, ch, cometActive = false;
    let cx, cy, cParts = [];

    function initC() { cw = cCanvas.width = window.innerWidth; ch = cCanvas.height = window.innerHeight; }
    initC();

    class MagicalPart {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.size = Math.random() * 30 + 10;
            this.life = 1.0;
            this.vx = (Math.random() - 0.2) * 2 + 7; // Быстрый отлет назад
            this.vy = (Math.random() - 0.5) * 4;
            this.decay = 0.005 + Math.random() * 0.008;
            const colors = ['#fff', '#00fbff', '#ff00ff', '#8f00ff', '#ffffff'];
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        draw() {
            cctx.globalAlpha = this.life * 0.45;
            cctx.fillStyle = this.color;
            cctx.beginPath();
            // Хвост из "плазменных" пятен
            cctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
            cctx.fill();
        }
    }

    function renderComet() {
        if(!cometActive) return;
        cctx.clearRect(0,0,cw,ch);
        
        // Генерация плотного магического шлейфа
        for(let i=0; i<15; i++) cParts.push(new MagicalPart(cx, cy));

        cParts.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= p.decay;
            if(p.life <= 0) cParts.splice(i, 1);
            else p.draw();
        });

        // Ядро с глубоким свечением
        cctx.globalAlpha = 1;
        cctx.shadowBlur = 50; cctx.shadowColor = "#00ffff";
        cctx.fillStyle = "#fff";
        cctx.beginPath(); cctx.arc(cx, cy, 14, 0, Math.PI*2); cctx.fill();
        cctx.shadowBlur = 100; cctx.shadowColor = "#ff00ff";
        cctx.stroke();
        cctx.shadowBlur = 0;

        requestAnimationFrame(renderComet);
    }

    // 3. Сценарная логика
    let progress = 0;
    const msg = "Мансур просил передать, что ты самая красивая, умная, милая, добрая и заботливая девушка в мире. Он тебя очень и очень сильно любит и ценит. Иногда он может вести себя, как идиот, но это не специально. Он любит тебя так, как никто другой никогда не сможет полюбить. Он просил передать, что ты такая же красивая, как эта 'комета'";

    function openLetter() {
        if(progress > 0) return;
        document.getElementById('hint').style.opacity = 0;
        document.getElementById('gBox').style.transform = "translateX(-50%) scale(3.5)";
        document.getElementById('gBox').style.bottom = "13%";
        setTimeout(() => {
            const ov = document.getElementById('ov');
            ov.style.display = 'flex';
            setTimeout(() => {
                ov.style.opacity = 1;
                typeTxt();
            }, 100);
        }, 2200);
        progress = 1;
    }

    function typeTxt() {
        const d = document.getElementById('t');
        let i = 0;
        const interval = setInterval(() => {
            d.innerHTML += msg.charAt(i); i++;
            if(i >= msg.length) { clearInterval(interval); document.getElementById('b').style.opacity = 1; }
        }, 25);
    }

    function witnessMagic() {
        document.getElementById('ov').style.opacity = 0;
        setTimeout(() => {
            document.getElementById('ov').style.display = 'none';
            // Небольшой подъем камеры в начале
            document.getElementById('stage').style.transform = "translateY(40%) scale(1.05)";
            
            setTimeout(() => {
                const flash = document.getElementById('flash');
                flash.style.opacity = 0.5; setTimeout(() => flash.style.opacity = 0, 300);

                cometActive = true;
                cCanvas.style.opacity = 1;
                
                // Старт - ВЫСОКО В НЕБЕ
                cx = cw + 300; cy = ch * 0.12;
                renderComet();

                const startT = Date.now();
                const dur = 11000; // Очень медленный, величественный полет
                
                function move() {
                    const elapsed = Date.now() - startT;
                    const p = elapsed / dur;
                    if(p < 1) {
                        cx = (cw + 300) - (cw * 2.8) * p;
                        cy = (ch * 0.12) + (ch * 0.45) * p; // Высокая дуга
                        requestAnimationFrame(move);
                    }
                }
                move();

                // ПОЗДНЕЕ И ПЛАВНОЕ ПРИБЛИЖЕНИЕ
                setTimeout(() => {
                    document.getElementById('stage').style.transition = "transform 6s cubic-bezier(0.15, 0.5, 0.2, 1)";
                    document.getElementById('stage').style.transform = "translateY(50%) scale(1.3) translateX(8%)";
                }, 3000); // Начинаем приближать только через 3 секунды полета
            }, 1200);
        }, 600);
    }
</script>
</body>
</html>
